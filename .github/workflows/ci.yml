name: CI

# Windows / macOS / Linux で、テストとリリースビルドを回し、バイナリの大きさと検索の時間を記録する。
# 結果は各ジョブの Summary に出る。基準値は docs/MEASURE.md に残す。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # FLTK（Pango / Cairo 付き）のビルドに要る開発用ライブラリ。Windows と macOS は cmake があればよい
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev \
            libxrender-dev libxfixes-dev libpango1.0-dev libcairo2-dev libfontconfig1-dev libgl1-mesa-dev libglu1-mesa-dev

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Build (release)
        run: cargo build --release

      - name: Record binary size
        shell: bash
        run: |
          BIN=target/release/neonote
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=$BIN.exe; fi
          SIZE=$(wc -c < "$BIN" | tr -d ' ')
          {
            echo "### Binary size ($RUNNER_OS)"
            echo
            echo "$SIZE bytes ($((SIZE / 1024)) KiB)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      # 検索・全置換・TextBuffer の時間。通常のテストでは動かない（#[ignore]）計測を、ここで 1 回だけ回す
      - name: Measure
        shell: bash
        run: |
          cargo test --release perf_ -- --ignored --nocapture --test-threads=1 | tee perf.txt
          {
            echo "### Measure ($RUNNER_OS)"
            echo
            echo '```'
            grep '^PERF\|PERF ' perf.txt | sed 's/^.*PERF /PERF /'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: neonote-${{ runner.os }}
          path: ${{ env.BIN }}
          if-no-files-found: error

  # タグ（v1.2.3 など）を push したときだけ、3 つの OS の実行ファイルを zip にして Releases に載せる。
  # 同じタグのリリースが既にあればファイルだけを差し替え、無ければ下書きで作る（説明を書いてから公開する）。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Zip each executable
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd dist
          for pair in "Windows:windows-x64" "macOS:macos-arm64" "Linux:linux-x64"; do
            os="${pair%%:*}"; name="${pair##*:}"
            chmod +x "neonote-$os"/* || true
            (cd "neonote-$os" && zip -9 "../neonote-$TAG-$name.zip" *)
          done
          ls -la *.zip

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "⚓｜NeoNote - FileEditor [$TAG]" --notes ""
          fi
          gh release upload "$TAG" dist/*.zip --clobber
